name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/security_scan.py
      - run: python -m pytest
      - run: python -m ruff check dashboard scripts tests
      - run: python -m compileall -q dashboard scripts tests
      - run: node --check desktop/plugin.js
